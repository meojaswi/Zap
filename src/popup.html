<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zap search</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <div class="popup-wrap">
    <div class="popup-search" id="search-bar">
      <span class="bolt">⚡</span>
      <input id="q" placeholder="search_" autocomplete="off" spellcheck="false">
      <button class="btn popup-new" id="new-btn" title="New snippet (Ctrl+N)">+ new</button>
    </div>
    <div class="popup-list" id="results"></div>
    <div class="add-form" id="add-form" hidden>
      <div class="row">
        <div class="field">
          <label for="add-name">Name</label>
          <input class="input" id="add-name" placeholder="Work email" autocomplete="off">
        </div>
        <div class="field">
          <label for="add-trigger">Trigger</label>
          <input class="input" id="add-trigger" autocomplete="off" spellcheck="false">
          <div class="hint" id="add-trigger-hint" hidden></div>
        </div>
      </div>
      <div class="field add-text">
        <div class="field-head">
          <label for="add-content">Text</label>
          <div class="field-tools">
            <button type="button" class="chip" id="add-link-quick" title="Add a clickable link">Link</button>
            <label class="inline-check" title="Bold, italic, links, lists and images for apps like Gmail, Outlook and Word"><input type="checkbox" id="add-rich"> Formatting</label>
          </div>
        </div>
        <div class="rich-toolbar" id="add-rich-toolbar" hidden>
          <button type="button" class="chip" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
          <button type="button" class="chip" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
          <button type="button" class="chip" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
          <button type="button" class="chip" data-cmd="createLink" title="Link">Link</button>
          <button type="button" class="chip" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
          <button type="button" class="chip" data-cmd="removeFormat" title="Remove formatting from the selection">Clear</button>
        </div>
        <div class="text-box" id="add-text-box">
          <textarea class="textarea" id="add-content" placeholder="The text this trigger becomes" spellcheck="false"></textarea>
          <div class="textarea rich-editor" id="add-rich-editor" contenteditable="true" spellcheck="false" hidden></div>
          <div class="ai-tools">
            <button type="button" class="ai-icon" id="add-generate-undo" title="Put your directions back" aria-label="Put your directions back" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5.5 3 2.5 6l3 3"/><path d="M3 6h6.5a3.5 3.5 0 0 1 0 7H6"/></svg></button>
            <button type="button" class="ai-icon ai-star" id="add-generate" title="Generate with AI from what you wrote here" aria-label="Generate with AI" hidden><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M7 1.5 8.6 6 13 7.6 8.6 9.2 7 13.7 5.4 9.2 1 7.6 5.4 6Z"/><path d="M13 10.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7Z"/></svg></button>
          </div>
        </div>
      </div>
      <div class="form-error" id="add-error" hidden></div>
      <div class="actions">
        <button class="btn primary" id="add-save">Save</button>
        <button class="btn" id="add-cancel">Cancel</button>
      </div>
    </div>
    <div class="popup-foot" id="search-foot">
      <span><kbd>↑</kbd> <kbd>↓</kbd> move</span>
      <span><kbd>Enter</kbd> paste</span>
      <span><kbd>Ctrl</kbd> <kbd>N</kbd> new</span>
      <span><kbd>Esc</kbd> close</span>
    </div>
    <div class="popup-foot" id="add-foot" hidden>
      <span><kbd>Ctrl</kbd> <kbd>Enter</kbd> save</span>
      <span><kbd>Esc</kbd> back to search</span>
    </div>
  </div>
  <script src="rich.js"></script>
  <script src="popup.js"></script>
</body>
</html>
