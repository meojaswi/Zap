<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zap fill-in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <div class="popup-wrap">
    <div class="popup-search fill-head">
      <span class="bolt">⚡</span>
      <span id="fill-title">Fill in</span>
    </div>
    <form class="fill-fields" id="fill-form" autocomplete="off"></form>
    <div class="popup-foot">
      <span><kbd>Enter</kbd> next / insert</span>
      <span><kbd>Esc</kbd> cancel</span>
    </div>
  </div>
  <script src="fill.js"></script>
</body>
</html>
