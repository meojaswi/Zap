# Builds, signs and publishes the Windows app when the version in tauri.conf.json changes.
# Installed copies find the new release through latest.json and notify the user.
name: Release app

on:
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # tauri.conf.json can change without a version bump; only a new version gets released.
  check:
    runs-on: ubuntu-latest
    outputs:
      is_new: ${{ steps.version.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.is_new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Zap __VERSION__
          generateReleaseNotes: true
          releaseDraft: false
      # latest.json links the installer through api.github.com, which allows only 60 unauthenticated
      # requests an hour per network, so updates on a busy college or office Wi-Fi would fail.
      # Point it at the release's plain download link instead.
      - name: Use plain download links in latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh release download "$tag" --pattern latest.json --dir "$RUNNER_TEMP" --clobber
          gh api "repos/${{ github.repository }}/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          node .github/scripts/direct-download-links.mjs "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/release.json"
          gh release upload "$tag" "$RUNNER_TEMP/latest.json" --clobber
